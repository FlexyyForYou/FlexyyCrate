name: Build FlexyCrates

on:
workflow_dispatch:
push:
branches: [ main ]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download source
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.14.3'

  - name: Extract source ZIP
    run: |
      unzip -o FlexyCrates-1.21.11-source.zip
      unzip -o src.zip

  - name: Build FlexyCrates
    working-directory: FlexyCrates/FlexyCrates
    run: gradle clean build

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: FlexyCrates-1.21.11
      path: FlexyCrates/FlexyCrates/build/libs/*.jar
      if-no-files-found: error
